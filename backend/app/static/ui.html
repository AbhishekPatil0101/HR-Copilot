<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Copilot — Acme Manufacturing</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #f8fafc; --text-muted: #94a3b8; --primary: #3b82f6;
      --primary-hover: #2563eb; --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .login-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.95rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.65rem 1.1rem; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-confirm { background: var(--success); color: #fff; margin-top: 0.65rem; }
    .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 0.4rem 0.75rem; font-size: 0.8rem; }
    .error-box { background: rgba(239,68,68,0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; }
    .quick-accounts { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .quick-accounts p { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.6rem; border-radius: 999px; font-size: 0.75rem; cursor: pointer; }
    .chip:hover { border-color: var(--primary); color: #93c5fd; }
    .chat-layout { max-width: 900px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 1rem; }
    .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1.1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 0.75rem; }
    .user-pill { font-size: 0.8rem; color: #93c5fd; background: rgba(59,130,246,0.15); padding: 0.25rem 0.65rem; border-radius: 999px; margin-right: 0.75rem; }
    .messages-area { flex: 1; overflow-y: auto; padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 82%; padding: 0.85rem 1rem; border-radius: 12px; line-height: 1.5; font-size: 0.93rem; white-space: pre-wrap; }
    .msg-user { align-self: flex-end; background: var(--primary); color: #fff; }
    .msg-assistant { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
    .badges-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .badge-tool { font-size: 0.72rem; padding: 0.2rem 0.5rem; border-radius: 6px; background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.35); }
    .badge-citation { font-size: 0.72rem; padding: 0.2rem 0.5rem; border-radius: 6px; background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.35); }
    .confirm-card { margin-top: 0.75rem; padding: 0.75rem; border-radius: 8px; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.35); }
    .input-bar { display: flex; gap: 0.6rem; margin-top: 0.75rem; }
    .input-bar input { flex: 1; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.95rem; }
    .input-bar .btn-send { width: auto; padding: 0 1.4rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const DEMO_ACCOUNTS = [
      { id: "E001", label: "E001 Priya (employee)", email: "priya@acme.test" },
      { id: "E002", label: "E002 Rahul (employee)", email: "rahul@acme.test" },
      { id: "E003", label: "E003 Sneha (Accounts)", email: "sneha@acme.test" },
      { id: "E004", label: "E004 Arjun (Sales)", email: "arjun@acme.test" },
      { id: "E005", label: "E005 Fatima (hr_admin)", email: "fatima@acme.test" },
      { id: "E006", label: "E006 Vikram (Probation)", email: "vikram@acme.test" },
    ];

    const SAMPLE_PROMPTS = [
      "How many casual leaves do I have left?",
      "Was I late last week, and will it cost me anything?",
      "Summarise my attendance for last week.",
      "Can I carry forward my earned leave?",
      "Apply casual leave for 12 and 13 Nov 2026 for a wedding.",
    ];

    function App() {
      const [token, setToken] = useState(() => localStorage.getItem("hr_token") || "");
      const [user, setUser] = useState(() => {
        const s = localStorage.getItem("hr_user");
        return s ? JSON.parse(s) : null;
      });
      const [email, setEmail] = useState("priya@acme.test");
      const [password, setPassword] = useState("Test@123");
      const [loginError, setLoginError] = useState("");
      const [loggingIn, setLoggingIn] = useState(false);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [sending, setSending] = useState(false);
      const endRef = useRef(null);

      useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

      async function handleLogin(e) {
        e.preventDefault();
        setLoginError(""); setLoggingIn(true);
        try {
          const res = await fetch("/auth/login", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (!res.ok) { setLoginError(data.detail || "Login failed"); return; }
          localStorage.setItem("hr_token", data.access_token);
          localStorage.setItem("hr_user", JSON.stringify(data.employee));
          setToken(data.access_token); setUser(data.employee);
          setMessages([{ role: "assistant", content: `Hello ${data.employee.name}! Ask me about leaves, attendance, or HR policies.`, tools_called: [], citations: [] }]);
        } catch { setLoginError("Network error connecting to backend."); }
        finally { setLoggingIn(false); }
      }

      function handleLogout() {
        localStorage.removeItem("hr_token"); localStorage.removeItem("hr_user");
        setToken(""); setUser(null); setMessages([]);
      }

      async function sendMessage(textOverride, confirmAction = null) {
        const text = (textOverride ?? input).trim();
        if (!text && !confirmAction) return;
        setMessages((p) => [...p, { role: "user", content: confirmAction ? "Yes, confirm leave application" : text }]);
        if (!textOverride && !confirmAction) setInput("");
        setSending(true);
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({
              message: text || "Confirm",
              history: messages.map((m) => ({ role: m.role, content: m.content })),
              confirm_action: confirmAction,
            }),
          });
          const rawText = await res.text();
          let data = {};
          try { data = JSON.parse(rawText); } catch { data = { detail: rawText || `HTTP ${res.status}` }; }
          if (res.status === 401) { handleLogout(); return; }
          if (!res.ok) {
            setMessages((p) => [...p, { role: "assistant", content: `Error (${res.status}): ${data.detail}`, tools_called: [], citations: [] }]);
            return;
          }
          setMessages((p) => [...p, {
            role: "assistant", content: data.reply, tools_called: data.tools_called || [],
            citations: data.citations || [], requires_confirmation: data.requires_confirmation,
            pending_action: data.pending_action, confirmedDone: false,
          }]);
        } catch {
          setMessages((p) => [...p, { role: "assistant", content: "Network error reaching /chat.", tools_called: [], citations: [] }]);
        } finally { setSending(false); }
      }

      if (!token || !user) {
        return (
          <div className="login-wrapper">
            <div className="login-card">
              <h1>HR Copilot</h1>
              <p className="subtitle">Acme Manufacturing — Employee & HR Assistant</p>
              {loginError && <div className="error-box">{loginError}</div>}
              <form onSubmit={handleLogin}>
                <div className="form-group"><label>Work Email</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required /></div>
                <div className="form-group"><label>Password</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required /></div>
                <button className="btn btn-primary" type="submit" disabled={loggingIn}>{loggingIn ? "Signing in..." : "Sign In"}</button>
              </form>
              <div className="quick-accounts">
                <p>Quick fill demo account (Password: Test@123):</p>
                <div className="chip-row">
                  {DEMO_ACCOUNTS.map((a) => (
                    <button key={a.id} type="button" className="chip" onClick={() => { setEmail(a.email); setPassword("Test@123"); }}>{a.label}</button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="chat-layout">
          <header className="chat-header">
            <div><strong>HR Copilot</strong> <span style={{ color: "var(--text-muted)", fontSize: "0.85rem" }}>· Acme Manufacturing</span></div>
            <div>
              <span className="user-pill">{user.employee_id} · {user.name} ({user.role})</span>
              <button className="btn btn-outline" onClick={handleLogout}>Logout</button>
            </div>
          </header>
          <div className="chip-row" style={{ marginBottom: "0.65rem" }}>
            {SAMPLE_PROMPTS.map((q, i) => <button key={i} className="chip" onClick={() => sendMessage(q)} disabled={sending}>{q}</button>)}
          </div>
          <div className="messages-area">
            {messages.map((m, idx) => (
              <div key={idx} className={`msg msg-${m.role}`}>
                <div>{m.content}</div>
                {m.role === "assistant" && (m.tools_called?.length > 0 || m.citations?.length > 0) && (
                  <div className="badges-row">
                    {m.tools_called?.map((t, ti) => <span key={`t-${ti}`} className="badge-tool">Tool: {t}</span>)}
                    {m.citations?.map((c, ci) => <span key={`c-${ci}`} className="badge-citation">Policy: {c}</span>)}
                  </div>
                )}
                {m.role === "assistant" && m.requires_confirmation && m.pending_action && !m.confirmedDone && (
                  <div className="confirm-card">
                    <div style={{ fontSize: "0.82rem", color: "#a7f3d0" }}>Action requires your confirmation before submitting:</div>
                    <button className="btn btn-confirm" disabled={sending} onClick={() => {
                      setMessages((p) => p.map((x, i) => i === idx ? { ...x, confirmedDone: true } : x));
                      sendMessage("Confirm leave request", m.pending_action);
                    }}>Confirm & Submit Leave Request</button>
                  </div>
                )}
              </div>
            ))}
            {sending && <div className="msg msg-assistant" style={{ color: "var(--text-muted)" }}>Thinking...</div>}
            <div ref={endRef} />
          </div>
          <form className="input-bar" onSubmit={(e) => { e.preventDefault(); sendMessage(); }}>
            <input type="text" placeholder="Ask about leaves, attendance, WFH, or HR policies..." value={input} onChange={(e) => setInput(e.target.value)} disabled={sending} />
            <button className="btn btn-primary btn-send" type="submit" disabled={sending}>Send</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
